# The compiled channel (test_output.py) and the judged channel (judge.toml), combined 0.5 / 0.5. The weights
# sit inline so the verifier can drop `judge` from them when the judged channel is unavailable.
[[reward]]
name = "reward"
aggregation = "weighted-mean"
weights = { test_output = 0.5, judge = 0.5 }

[scoring.test_output]
aggregation = "weighted-mean"
