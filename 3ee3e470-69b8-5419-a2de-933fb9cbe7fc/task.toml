schema_version = "1.4"
reward_type = "bounded_continuous"

artifacts = [
  { source = "/logs/agent", exclude = ["./completions"] },
  { source = "/workspace", exclude = ["./data"] },
]

[metadata]
category = "mcp-tool-calling"
tags = ["field-service", "response-times", "revision-cutover", "depot-local-time", "utc-offset", "corrupted-rollup", "silent-truncation", "tool-retirement", "negative-control", "photographed-job-sheet", "voice-note", "corrections-register"]
null_floor = 0.0
discrimination_weight = 0.5
platforms = ["linux/amd64", "linux/arm64"]

[agent]
timeout_sec = 28800
network_mode = "public"
user = "1000:1000"

[verifier]
environment_mode = "separate"
network_mode = "public"
timeout_sec = 1800
user = "root"

[verifier.env]
JUDGE_MODEL = "${JUDGE_MODEL:-anthropic/claude-opus-5-5}"
JUDGE_TRANSPORT = "${JUDGE_TRANSPORT:-rewardkit}"
JUDGE_SKIP = "${JUDGE_SKIP:-0}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
OPENAI_BASE_URL = "${OPENAI_BASE_URL:-}"
OPENAI_API_BASE = "${OPENAI_API_BASE:-}"
ATLAS_END_ENV = "/logs/artifacts/atlas/end_env.json"

[verifier.environment]
workdir = "/tests"
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
network_mode = "public"

[[verifier.collect]]
service = "main"
command = "python3 /harness/atlas/state_capture.py"
timeout_sec = 300

[environment]
build_timeout_sec = 1800
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
network_mode = "public"

[task]
name = "ethara/3ee3e470-69b8-5419-a2de-933fb9cbe7fc"
version = "1.0.0"
description = "Close a 28-day FSR-9 on-call response audit for Calderwick Regional Network Operations: derive every response-time finding from the paging archive, roster board, telemetry, logs and photographed hand-back evidence, survive mid-run record changes, then close the period, correct, notify, annotate and report."
keywords = [
  "mcp",
  "multi-server",
  "audit",
  "cross-modal-evidence",
  "temporal-rules",
  "record-writeback",
  "fault-tolerance",
  "prompt-injection-resistance",
  "long-horizon",
  "image-and-audio-evidence",
]
authors = [{ name = "dishansh.tiwari", email = "dishansh.tiwari@ethara.ai" }]

[upstream_provenance]
origin = "original"
provenance_date = "2026-11-16"
source_kind = "synthetic"

