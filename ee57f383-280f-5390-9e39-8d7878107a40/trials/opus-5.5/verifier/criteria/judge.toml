# The judged channel for D5, the agent's final prose account. This file is the one source of the
# judged criteria, and nothing compiles it into another tree: there is no tests/reward/ directory.
# Before stage 3, test.sh copies this whole tests tree to /logs/verifier/criteria, rewrites only
# the `judge = ` line below in that copy from $JUDGE_MODEL, and runs rewardkit against the copy;
# this file itself is never rewritten. An empty $JUDGE_MODEL leaves the value below standing.
# $JUDGE_TRANSPORT selects the dispatch path and only `rewardkit` is implemented; JUDGE_SKIP=1, or
# any other transport, deletes this file from the copy and drops `judge` from that copy's
# reward.toml weights, so the reward is the compiled channel alone and test.sh records the
# condition in /logs/verifier/judge_wiring.json. Every criterion here reads
# final_message.md and nothing else, so no judged item grades a statement a compiled item reads
# (contract mece_rule); the records themselves are graded by tests/test_output.py.
#
# Judged tiering and total, recorded here and in no other file. These figures are a property of
# the compiled rubric, never of the contract.
#
#   tier      items     weight   positive   what it grades
#   J01-J10      10          5         50   rule comprehension that decides whether a finding is
#                                           right, including the three explicit rejections: UTC as
#                                           the edition boundary, the roster day or roster week as
#                                           the boundary, and a fixed summer-time offset after the
#                                           2026-10-25 clock change
#   J11-J21      11          5         55   one item per decisive case: the 3 override cases, the
#                                           4 clock-change cases and the 4 corrections
#   J22-J34      13          3         39   the process the figures depend on: duty-population
#                                           coverage, the corrections register, the period close,
#                                           and abstention on out-of-scope and sister-depot drivers
#   J35-J44      10          1         10   presentation: a rule-and-table line per finding, the
#                                           three headline totals, and readable prose
#   J45           1          5          5   per-finding rule-and-figures coverage, held on the
#                                           closed 1/3/5 scale by item 9g
#   total        45                    159   judged positive weight
#
# No criterion negates, so the judged positive total is the sum of all 45 weights: 159.
[judge]
judge = "openai/gpt-6.1-[REDACTED]"
files = ["/logs/verifier/judge_ws/final_message.md", "/logs/verifier/judge_ws/instruction.md", "/logs/verifier/judge_ws/end_state.md", "/logs/verifier/judge_ws/trajectory.md"]
reference = "/opt/truth/audit_reference.md"
reasoning_effort = "medium"
mode = "individual"
samples = 1
guard = "penalize"

[scoring]
aggregation = "weighted-mean"

# --- J01-J10, weight 5: rule comprehension that decides whether a finding is right -------------

[[criterion]]
id = "J01"
annotations = { obligation = "D5", dimension = "outcome", evaluation_target = "final-answer" }
files = ["/logs/verifier/judge_ws/final_message.md"]
weight = 5
negate = false
type = "binary"
description = "J01: judge from final_message.md (the run's closing note). The note says the edition that governs a duty is fixed by that duty's start time in depot local time, so a duty is never split part-way through however long it runs."

[[criterion]]
id = "J02"
annotations = { obligation = "D5", dimension = "outcome", evaluation_target = "final-answer" }
files = ["/logs/verifier/judge_ws/final_message.md"]
weight = 5
negate = false
type = "binary"
description = "J02: judge from final_message.md (the run's closing note). The note says the break requirement is forty-five minutes under both editions but the blocks that count toward it differ, fifteen minutes or longer under the earlier edition and thirty minutes or longer under the reissue, so a fifteen-and-thirty split qualifies only thirty under the reissue."

[[criterion]]
id = "J03"
annotations = { obligation = "D5", dimension = "outcome", evaluation_target = "final-answer" }
files = ["/logs/verifier/judge_ws/final_message.md"]
weight = 5
negate = false
type = "binary"
description = "J03: judge from final_message.md (the run's closing note). The note says the night-work limit and its window both move at the reissue, from four hundred and eighty minutes against a midnight-to-four window to four hundred and twenty minutes against an eleven-at-night-to-five window."

[[criterion]]
id = "J04"
annotations = { obligation = "D5", dimension = "outcome", evaluation_target = "final-answer" }
files = ["/logs/verifier/judge_ws/final_message.md"]
weight = 5
negate = false
type = "binary"
description = "J04: judge from final_message.md (the run's closing note). The note says periods of availability are excluded from working time under the earlier edition and counted in full under the reissue, and that this is why the availability findings exist at all."

[[criterion]]
id = "J05"
annotations = { obligation = "D5", dimension = "outcome", evaluation_target = "final-answer" }
files = ["/logs/verifier/judge_ws/final_message.md"]
weight = 5
negate = false
type = "binary"
description = "J05: judge from final_message.md (the run's closing note). The note says the rolling working time limit is tested over a fixed Monday-to-Sunday week at three thousand six hundred minutes under the earlier edition and over a rolling seven-day reference period at three thousand three hundred and sixty minutes under the reissue."

[[criterion]]
id = "J06"
annotations = { obligation = "D5", dimension = "outcome", evaluation_target = "final-answer" }
files = ["/logs/verifier/judge_ws/final_message.md"]
weight = 5
negate = false
type = "binary"
description = "J06: judge from final_message.md (the run's closing note). The note states the order of authority it applied: the driver card download governs driving, break and rest minutes; a signed manual-entry certificate governs a day the download leaves a gap; a signed infringement report outranks an unsigned dispute flag; and the roster and the traffic office's keyed actuals are overridable and never outrank the card."

[[criterion]]
id = "J07"
annotations = { obligation = "D5", dimension = "outcome", evaluation_target = "final-answer" }
files = ["/logs/verifier/judge_ws/final_message.md"]
weight = 5
negate = false
type = "binary"
description = "J07: judge from final_message.md (the run's closing note). The note says that for the shortfall rules, break composition and daily and weekly rest, the figure it reports is the limit less the actual, while for every other rule it is the actual less the limit, and that it is positive whole minutes either way."

[[criterion]]
id = "J08"
annotations = { obligation = "D5", dimension = "robustness", evaluation_target = "final-answer" }
files = ["/logs/verifier/judge_ws/final_message.md"]
weight = 5
negate = false
type = "binary"
description = "J08: judge from final_message.md (the run's closing note). The note explicitly rejects the UTC instant as the test of which edition applies, and says a duty starting late on 2026-10-25 in depot local time is still governed by the earlier edition even though its UTC label reads otherwise."

[[criterion]]
id = "J09"
annotations = { obligation = "D5", dimension = "robustness", evaluation_target = "final-answer" }
files = ["/logs/verifier/judge_ws/final_message.md"]
weight = 5
negate = false
type = "binary"
description = "J09: judge from final_message.md (the run's closing note). The note explicitly rejects the roster day or roster week as the test of which edition applies, so neither the whole week commencing 2026-10-26 nor the day a duty ends on decides it, and it says the traffic office's draft memo urging the roster-week reading carries no weight."

[[criterion]]
id = "J10"
annotations = { obligation = "D5", dimension = "robustness", evaluation_target = "final-answer" }
files = ["/logs/verifier/judge_ws/final_message.md"]
weight = 5
negate = false
type = "binary"
description = "J10: judge from final_message.md (the run's closing note). The note explicitly rejects holding one fixed summer-time offset for duties after the 2026-10-25 clock change, and says the carriers that keep the pre-change offset in their labels after that date were read as such rather than re-timed."

